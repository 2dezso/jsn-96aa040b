<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSN Stories</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF2EF;--ink:#14281E;--muted:#587064;--pitch:#0B7A47;--out:#C8321F;
--Jim:#E4572E;--Ash:#6C4FD8;--Haz:#0E9F8E;--Cal:#C28500;--Dez:#2A7DE1;--Jack:#D6347F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 Archivo,system-ui,sans-serif;min-height:100vh;padding:14px 16px 30px}
.top{width:min(440px,100%);margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.top b{font-weight:900;font-stretch:125%;font-size:16px}
.top a{color:var(--pitch);font-weight:700}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:14px auto 0;max-width:44ch}
/*@include stories.css*/
</style>
</head>
<body>
<div class="top"><b>JSN</b><a href="./">Open the full JSN app</a></div>
<div id="root"></div>
<p class="hint">Tap the right side for the next story, the left to go back. Every slide is sized to screenshot straight into the group chat.</p>
<script>
const D = __DATA__;
/*@include stories.js*/
JSNStories.mount(document.getElementById('root'), D, {
  start: parseInt(location.hash.slice(1)) || 1,  // #3 opens the third slide
  onChange: n => history.replaceState(null, '', '#' + n),
});
</script>
</body>
</html>
